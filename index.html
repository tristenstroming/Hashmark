<style>
/* Hashmark v6 (Nov 10, 2026) — "Slate".
   Layout: one calm column of games (the slate); a game opens as a sheet, a player opens as a second sheet on top.
   Projections are range bars: the model's likely range (25th–75th pct dark, 10th–90th light), median dot, DraftKings line tick.
   Over = cool blue, under = warm amber. Green / red mean graded hit / miss only. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#f0f2f5; --panel-3:#e7eaef;
  --ink:#15171c; --ink-2:#454b57; --muted:#7a8190; --faint:#a9afba;
  --line:rgba(17,20,28,.08); --line-2:rgba(17,20,28,.14);
  --accent:#3e6fdc; --accent-soft:rgba(62,111,220,.10);
  --over:#3e6fdc; --over-soft:rgba(62,111,220,.12); --under:#bf7330; --under-soft:rgba(191,115,48,.12);
  --good:#1d9466; --good-soft:rgba(29,148,102,.11); --bad:#d0465a; --bad-soft:rgba(208,70,90,.10);
  --band:rgba(17,20,28,.07); --band-2:rgba(17,20,28,.16);
  --chrome:rgba(245,246,248,.78); --scrim:rgba(15,17,22,.28);
  --shadow:0 1px 2px rgba(17,20,28,.05),0 8px 24px -14px rgba(17,20,28,.18);
  --shadow-lg:0 30px 80px -20px rgba(17,20,28,.35);
  --disp:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --lift-c:#ffffff; --lift:0%;
  --r:16px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,.72,0,1);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#161920; --panel-2:#1c2028; --panel-3:#242934;
  --ink:#e9ebf0; --ink-2:#b6bcc8; --muted:#808898; --faint:#565d6b;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --accent:#8db1ff; --accent-soft:rgba(141,177,255,.12);
  --over:#8db1ff; --over-soft:rgba(141,177,255,.14); --under:#e6ab6c; --under-soft:rgba(230,171,108,.14);
  --good:#52cf9f; --good-soft:rgba(82,207,159,.12); --bad:#f07c8c; --bad-soft:rgba(240,124,140,.12);
  --band:rgba(255,255,255,.07); --band-2:rgba(255,255,255,.17);
  --chrome:rgba(15,17,21,.78); --scrim:rgba(0,0,0,.5); --lift:32%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6); --shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#161920; --panel-2:#1c2028; --panel-3:#242934;
  --ink:#e9ebf0; --ink-2:#b6bcc8; --muted:#808898; --faint:#565d6b;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --accent:#8db1ff; --accent-soft:rgba(141,177,255,.12);
  --over:#8db1ff; --over-soft:rgba(141,177,255,.14); --under:#e6ab6c; --under-soft:rgba(230,171,108,.14);
  --good:#52cf9f; --good-soft:rgba(82,207,159,.12); --bad:#f07c8c; --bad-soft:rgba(240,124,140,.12);
  --band:rgba(255,255,255,.07); --band-2:rgba(255,255,255,.17);
  --chrome:rgba(15,17,21,.78); --scrim:rgba(0,0,0,.5); --lift:32%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6); --shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-feature-settings:"cv11","ss03";letter-spacing:-.008em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11"}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:0 var(--gut-r) 0 var(--gut-l);height:60px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.02em;white-space:nowrap}

.nav{position:relative;margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--panel-2)}

.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink-2)}

.tools{display:flex;gap:8px}

/* bottom tab bar (phones) */
.tabbar{display:none}
@media (max-width:760px){
  .nav{display:none}
  .tools{margin-left:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--chrome);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:550;color:var(--muted)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))!important}
}

main{max-width:1040px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:28px 64px}
.view{animation:rise .32s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:22px}
.vhead h1{font-size:28px;font-weight:650;letter-spacing:-.03em}
.vhead p{margin:6px 0 0;color:var(--muted);max-width:60ch;font-size:14px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--panel-2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:550;color:var(--muted);white-space:nowrap;transition:background-color .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:550;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* slate */
.slot{margin:0 0 26px}
.slot h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 4px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:10px}
.game{display:grid;grid-template-columns:1fr auto;gap:14px 16px;align-items:center;text-align:left;width:100%;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);min-width:0}
.game:hover{border-color:var(--line-2)}
.teams{display:flex;flex-direction:column;gap:8px;min-width:0}
.trow{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:color-mix(in oklab,var(--tc),var(--lift-c) var(--lift));flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.tname{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow .ab{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.trow.lose .tname{color:var(--ink-2);font-weight:500}
.gright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1}
.score .lose{color:var(--muted);font-weight:500}
.gfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.wp{flex:1;height:4px;border-radius:4px;background:var(--panel-3);overflow:hidden;display:flex}
.wp i{display:block;height:100%;background:color-mix(in oklab,var(--tc),var(--lift-c) var(--lift));transition:width .8s var(--spring)}
.wp i + i{margin-left:2px}
.mkt{white-space:nowrap}
.gfoot > span:first-child{white-space:nowrap}
@media (max-width:560px){ .gfoot{flex-wrap:wrap;gap:8px 10px} .gfoot .wp{flex:1 1 100%;order:-1} .gfoot .status{margin-left:auto} }
.lean{color:var(--ink-2);font-weight:550}
.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.status.on::before{background:var(--good)}
.status.live::before{background:var(--bad)}
.skel{background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2)) 0 0/200% 100%;animation:sh 1.2s linear infinite;border-radius:6px;color:transparent!important}
@keyframes sh{to{background-position:-200% 0}}

/* range bar */
.rb{position:relative;height:22px;min-width:120px}
.rb .track{position:absolute;left:0;right:0;top:10px;height:2px;border-radius:2px;background:var(--band)}
.rb .b1{position:absolute;top:7px;height:8px;border-radius:5px;background:var(--band-2);opacity:.55;transform-origin:left;transition:transform .7s var(--spring),opacity .4s}
.rb .b2{position:absolute;top:6px;height:10px;border-radius:5px;background:var(--band-2);transform-origin:left;transition:transform .7s var(--spring)}
.rb .md{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ink);border:2px solid var(--panel);transition:left .7s var(--spring)}
.rb .ln{position:absolute;top:1px;width:2px;height:20px;margin-left:-1px;border-radius:2px;background:var(--side,var(--muted))}
.rb.pre .b1,.rb.pre .b2{transform:scaleX(0)}
.rb.over{--side:var(--over)} .rb.under{--side:var(--under)}
.rb.over .b2{background:color-mix(in srgb,var(--over) 35%,transparent)} .rb.under .b2{background:color-mix(in srgb,var(--under) 35%,transparent)}
.side{font-weight:650;font-size:13px;white-space:nowrap}
.side.over{color:var(--over)} .side.under{color:var(--under)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;letter-spacing:.02em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.pick{background:var(--accent-soft);color:var(--accent)}
.tag.q{background:var(--under-soft);color:var(--under)}
.tag.win{background:var(--good-soft);color:var(--good)} .tag.loss{background:var(--bad-soft);color:var(--bad)} .tag.push,.tag.void{background:var(--panel-2);color:var(--muted)}
.tag.est{background:var(--panel-2);color:var(--muted);font-weight:550}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .48s var(--spring)}
.sheet.on{transform:none}
.sheet{transition:transform .48s var(--spring),opacity .3s var(--ease)}
.sheet.under-sheet,.sheet.under-sheet.on{transform:translateX(-40px);opacity:0}
.sh-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line);background:var(--chrome);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.sh-head b{font-size:15px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.back{border:0;background:var(--panel-2);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}

@media (max-width:760px){
  .sheet{top:auto;left:0;width:100%;height:calc(100% - 28px - env(safe-area-inset-top,0px));border-left:0;border-radius:20px 20px 0 0;transform:translateY(104%)}
  .sheet.under-sheet,.sheet.under-sheet.on{transform:translateY(-10px) scale(.97);opacity:0}
  .sh-head{padding-top:12px;border-radius:20px 20px 0 0;position:relative}
  .sh-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:var(--line-2)}
}
.sec{margin:26px 0 0}
.sec > h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* game sheet */
.mh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.mh .tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mh .crest{width:44px;height:44px;border-radius:14px;background:var(--tc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}
.mh .crest.lt{color:#111}

.mrow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-top:1px solid var(--line)}
.mrow div{padding:12px 6px 0;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow div + div{border-left:1px solid var(--line)}
.mrow .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mrow .v{font-size:17px;font-weight:650;letter-spacing:-.02em}
.mrow .s{font-size:12px;color:var(--muted)}
.wpbig{margin-top:16px}

.wpbig .lg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:13px;color:var(--ink-2);line-height:1.55}
.outs{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.plist{display:flex;flex-direction:column}
.pl{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}

.st{display:grid;grid-template-columns:86px minmax(0,1fr) 112px;align-items:center;gap:12px;padding:3px 0}

@media (max-width:420px){ .st{grid-template-columns:70px minmax(0,1fr) 96px;gap:8px} }

/* player sheet */
.ph{display:flex;align-items:center;gap:14px}
.ph .av{width:52px;height:52px;border-radius:16px;background:var(--tc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:0 0 auto}

.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}

.big .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.curve{width:100%;height:150px;display:block}

.ladder{display:flex;flex-direction:column}

/* ===== v6.4: one motion system for everything that opens and closes =====
   Closing is quick and quiet (.28s, standard ease); opening is longer and decelerates (.52s, ease-out-quint). Content is
   mounted first and the class flips two frames later, so the browser lays the new content out before the animation starts. */
:root{--exp:cubic-bezier(.22,1,.36,1);--col:cubic-bezier(.4,0,.2,1)}
.acc,.wacc,.xacc,.gacc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--col)}
.pl.open > .acc,.fold.open > .acc,.wacc.open,.xacc.open,.gwrap.open > .gacc{grid-template-rows:1fr;transition:grid-template-rows .52s var(--exp)}
.acc-in,.wacc-in,.xin,.gbody{overflow:hidden;min-height:0;opacity:0;transform:translateY(-6px);transition:opacity .16s var(--col),transform .28s var(--col)}
.pl.open > .acc > .acc-in,.fold.open > .acc > .acc-in,.wacc.open > .wacc-in,.xacc.open > .xin,.gwrap.open > .gacc > .gbody{opacity:1;transform:none;transition:opacity .42s .06s var(--exp),transform .52s var(--exp)}
.pl-h .chev,.fold-h .chev,.gchev{transition:transform .5s var(--exp)}
.pl{transition:background-color .35s var(--col)}

  const rec=a=>{ const g=a.filter(p=>p.result==='win'||p.result==='loss'); const w=g.filter(p=>p.result==='win').length; return {n:g.length,w,l:g.length-w,u:g.reduce((s,p)=>s+(p.units||0),0)}; };
  const S=rec(picks); const weeks=[...new Set(picks.map(p=>p.week))].sort((a,b)=>a-b); const byW=weeks.map(w=>({wk:w,...rec(picks.filter(p=>p.week===w))})).filter(x=>x.n);
  const mks=['REC','RECY','RY','CAR','RRY','PY','PC','PA','PTD','PRY']; const byM=mks.map(mk=>({mk,...rec(picks.filter(p=>p.mk===mk))})).filter(x=>x.n);
  const sides=['over','under'].map(s=>({s,...rec(picks.filter(p=>p.side===s))}));
  // accuracy: model side on every graded prop row with p_over
  const A=LOG.picks.filter(x=>x.type==='prop'&&x.mk!=='ATD'&&x.p_over!=null&&x.actual!=null&&(x.result==='win'||x.result==='loss')&&!x.backfilled);
  const seen=new Set(), Au=[]; for(const x of A){ const k=x.week+'|'+x.pid+'|'+x.mk; if(seen.has(k)) continue; seen.add(k); Au.push(x); }
  const right=Au.filter(x=>(x.p_over>=.5)===(x.actual>x.line)).length;
  const bands=[[.5,.55],[.55,.6],[.6,.65],[.65,.7],[.7,.8],[.8,1.01]].map(([lo,hi])=>{ const r=Au.filter(x=>{ const c=Math.max(x.p_over,1-x.p_over); return c>=lo&&c<hi; }); const hit=r.filter(x=>(x.p_over>=.5)===(x.actual>x.line)).length; const cl=r.reduce((s,x)=>s+Math.max(x.p_over,1-x.p_over),0); return {lo,hi,n:r.length,act:r.length?hit/r.length:null,cl:r.length?cl/r.length:null}; }).filter(b=>b.n>=10);
  const recent=LOG.picks.filter(p=>p.type==='prop'&&(p.tier||'pick')==='pick'&&(p.result==='win'||p.result==='loss'||p.result==='push')).sort((a,b)=>b.week-a.week||String(b.logged).localeCompare(String(a.logged))).slice(0,25);
  const roi=S.n?S.u/S.n:0;
  $('#main').innerHTML=`<section class="view"><div class="vhead"><div><h1>Track record</h1><p>Model picks graded at the DraftKings price logged with them. Touchdown props and picks on estimated −110 prices are kept apart.</p></div></div>
   <div class="tiles"><div class="card tile"><span class="k">Record</span><span class="v num">${S.w}–${S.l}</span><span class="s num">${S.n?(100*S.w/S.n).toFixed(1)+'% hit':''}</span></div>
     <div class="card tile"><span class="k">Units</span><span class="v num ${S.u>=0?'pos':'neg'}">${sgnU(S.u)}</span><span class="s num">${(roi*100).toFixed(1)}% return per pick</span></div>
     <div class="card tile"><span class="k">Overs / unders</span><span class="v num" style="font-size:22px">${sides[0].w}–${sides[0].l} · ${sides[1].w}–${sides[1].l}</span><span class="s num">${sgnU(sides[0].u)} · ${sgnU(sides[1].u)}</span></div>
     <div class="card tile"><span class="k">Model side</span><span class="v num">${Au.length?Math.round(100*right/Au.length)+'%':'—'}</span><span class="s num">right on ${right} of ${Au.length} props</span></div></div>
   <div class="sec"><h3>Units by week</h3><div class="card" style="padding:16px">${weekChart(byW)}</div></div>
   <div class="grid2" style="margin-top:14px"><div><div class="sec" style="margin-top:12px"><h3>By market</h3><div class="card tblw"><table class="tbl"><thead><tr><th>Market</th><th>Record</th><th>Hit</th><th>Units</th></tr></thead><tbody>${byM.map(x=>`<tr><td>${esc(MK[x.mk].label)}</td><td class="num">${x.w}–${x.l}</td><td class="num">${Math.round(100*x.w/x.n)}%</td><td class="num ${x.u>=0?'pos':'neg'}">${sgnU(x.u)}</td></tr>`).join('')}</tbody></table></div></div></div>
     <div><div class="sec" style="margin-top:12px"><h3>Calibration</h3><div class="card" style="padding:16px">${calChart(bands)}<p class="xs muted" style="margin:8px 0 0">Each dot is a band of the model's stated chance (across) against how often its side hit (up). On the line = honest chances; below = overconfident.</p></div></div></div></div>
   <div class="sec"><h3>Recent results</h3><div class="card">${recent.map(pickRow).join('')||'<div class="empty">Nothing graded yet.</div>'}</div></div></section>`;
  $('#main').querySelectorAll('.plk').forEach(b=>b.addEventListener('click',()=>{ const p=D.players[b.dataset.p]; if(p&&p.game&&D.games.some(g=>g.id===p.game)) expandUnder(b,b.dataset.p,b.dataset.mk); else toast('Past game: projection no longer loaded'); }));
  grow($('#main')); }
function weekChart(rows){ if(!rows.length) return '<div class="empty">No graded weeks yet.</div>'; const W=900,H=200,P=28; const mx=Math.max(5,...rows.map(r=>Math.abs(r.u))); const bw=(W-2*P)/rows.length; const y0=H/2;
  return `<svg class="chart" style="max-width:${W}px;margin:0 auto" viewBox="0 0 ${W} ${H+18}" role="img" aria-label="Units won or lost by week"><line x1="${P}" x2="${W-P}" y1="${y0}" y2="${y0}" stroke="var(--line-2)"/>
   ${rows.map((r,i)=>{ const h=Math.abs(r.u)/mx*(H/2-14); const x=P+i*bw+bw*.2, w=bw*.6; const y=r.u>=0?y0-h:y0; return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(1,h)}" rx="4" fill="var(--${r.u>=0?'good':'bad'})" opacity=".85" style="transform-box:fill-box;transform-origin:${r.u>=0?'bottom':'top'};transform:scaleY(.02)" data-grow="scaleY(1)"><title>Week ${r.wk}: ${r.w}–${r.l}, ${sgnU(r.u)}</title></rect>
     <text x="${x+w/2}" y="${r.u>=0?y-6:y+h+13}" text-anchor="middle">${sgnU(r.u)}</text><text x="${x+w/2}" y="${H+14}" text-anchor="middle">Wk ${r.wk}</text>`; }).join('')}</svg>`; }
function calChart(b){ if(!b.length) return '<div class="empty">Not enough graded props.</div>'; const W=300,H=220,P=34; const X=v=>P+(v-.5)/(.4)*(W-P-10), Y=v=>H-P-(v-.4)/(.5)*(H-P-10);
  return `<svg class="chart" style="max-width:420px;margin:0 auto" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stated chance vs actual hit rate"><line x1="${X(.5)}" y1="${Y(.5)}" x2="${X(.9)}" y2="${Y(.9)}" stroke="var(--line-2)" stroke-dasharray="4 4"/>
   ${[.5,.6,.7,.8,.9].map(v=>`<text x="${X(v)}" y="${H-P+16}" text-anchor="middle">${Math.round(v*100)}</text>`).join('')}${[.4,.5,.6,.7,.8,.9].map(v=>`<text x="${P-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}</text>`).join('')}
   <line x1="${P}" x2="${W-10}" y1="${H-P}" y2="${H-P}" stroke="var(--line-2)"/>
   <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${b.map(x=>`${X(x.cl)},${Y(x.act)}`).join(' ')}"/>
   ${b.map(x=>`<circle cx="${X(x.cl)}" cy="${Y(x.act)}" r="${3+Math.min(5,Math.sqrt(x.n)/6)}" fill="var(--accent)"><title>Stated ${Math.round(x.cl*100)}%, hit ${Math.round(x.act*100)}% (${x.n} props)</title></circle>`).join('')}</svg>`; }

function howHTML(){ const d=D, L=d.league||{}, N_SIMS=N, MODEL_W=0.35, PROB_MODE='model';
  return `
  <h3>The short version</h3>
  <p>Every single prop answers two separate questions. <strong>Model</strong> is the model's chance of the over and the under. <strong>Value</strong> compares that chance with what the price needs to win to break even. A −110 bet needs 52.4%, so a prop the model gives 58% is <em>Value</em> (61%+ is <em>Strong</em>), while one at 51% is only <em>Fair</em>, even though it's still more likely than not. A prop can be likely and still a poor bet if the price is too steep, and a long shot can be a good bet if the price is long enough.</p>
  <p>The <em>Hit rate</em> column is the plain check: how many of his games this season cleared that line, with one square per game, filled when it hit. Best bets has a <em>Most likely to hit</em> list and a separate <em>Best price</em> list for those two questions. Parlays have their own tab and don't change any single-prop number.</p>
  <h3>The model: a game simulator</h3>
  <p>Each Week ${d.week} game is played out ${N_SIMS.toLocaleString()} times. Every player prop, alternate line, game prop and parlay comes from the same simulated games, so they stay consistent with each other. Passing yards are the sum of what the receivers catch, and anytime touchdowns add up to the team's touchdowns.</p>
  <ol>
    <li><strong>Team strength.</strong> Points scored and allowed are fit with a ridge regression (an opponent-adjusted rating that is pulled toward league average until there's enough data). This season counts fully and last season at 30%. Two more inputs go in: rest days (about ${L.rest} points per extra day of rest, capped at four days) and an opponent-adjusted yards-per-play rating, worth 20% of the blend because yards per play is steadier than points from week to week. Home field is worth about ${L.hfa} points this season.</li>
    <li><strong>EPA efficiency.</strong> Expected points added per play, from nflverse play-by-play on competitive snaps (win probability 5–95%), is fit the same opponent-adjusted way, using this season plus last season at 30%, and turned into points. It is 35% of the model's team rating; scoring and yards per play make up the rest. Each QB's EPA per dropback and completion % over expected (this season plus last at half weight) are added to his yards-per-attempt rating at half weight, so a QB change moves his team and his receivers by how efficient he really is, not just his raw yardage. In the Week 2–5 backtest the EPA blend was close to neutral on game scores (slightly better margins, slightly worse totals), so it carries a moderate weight.</li>
    <li><strong>Positions.</strong> Each player's position comes from nflverse rosters, so backup QBs, linemen and punters who touched the ball on a trick play are left out and backup RBs are treated as RBs.</li>
    <li><strong>QB rushing and history.</strong> A QB's carries and yards per carry start from his last two seasons. His rushing efficiency is measured against his own running backs (a Lamar Jackson or Jayden Daniels gains far more per carry than his RBs; a pocket passer gains less), and the opponent's run defense applies at half strength because scrambles meet less of it. His own past games against this opponent (since 2024) move his passing yards per attempt (and so his receivers' yards per catch) and his rushing yards per carry by up to ±6% each. Each past meeting is compared with what he'd normally do against a defense that good that season, so only the part specific to him and this opponent counts, not the defense's overall quality (already in the model). One meeting moves him only a little; several move him more. His share of team carries stays his own when running backs are out (their carries go to the other backs), which fixed QB rushing props being over-projected.</li>
    <li><strong>Who is in the rotation.</strong> Only players likely to get the ball count toward a team's targets and carries: anyone who touched it in the team's last two games, anyone with a real role (10%+ of targets or 15%+ of carries), players on the injury report or newly traded in, and anyone with a posted prop. If the listed shares still add up to more than the team's total, the excess comes out of the small-role players, not the starters. (Before this, deep backups diluted the top receivers by ~15–20%, which tilted most receiving props toward the under.)</li>
    <li><strong>How it's checked.</strong> The model is rebuilt as of a past week using only earlier games and the players who actually suited up (from snap counts, including ones who never touched the ball), then scored on what happened. On all of the 2025 season (weeks 3–18, about 6,000 props it had never seen) it beat simply using the player's season average in every prop type (rec yds off by 23.8 vs 25.9, pass yds 53 vs 56, rush yds 20.5 vs 21.1, carries 4.1 vs 4.2), and its over/under calls at the season-average line were right 59–66% of the time vs 50–60% for "he's cleared it most games". Its chances were honest, within about 2 points on average for every prop type. The same test on 2023 and 2024 gave similar results. Most prop types land within about 2 points each season; receiving-yards overs ran a couple of points more often than stated in 3 of 4 seasons (now corrected), and QB pass attempts swing several points from season to season — which is why corrections are refit within each season instead of carried over. Every model change must now pass this four-season test; the track record keeps score from here.</li>
    <li><strong>History vs this defense.</strong> Every prop shows how the player did against this opponent since 2024 (any team he was on): how often the model's side would have hit at today's line, his average, and a <em>Disagrees</em> / <em>Agrees</em> tag when 2+ meetings point clearly one way. In the model, each past meeting is compared with what he'd normally do against that kind of defense that season, so only the player-specific part counts. Tested on weeks 3–5, that leftover only helped for carry share (up to ±15%, shrunk toward no change for small samples); for targets, catches and receiving yards it added noise, so those are shown but not weighted.</li>
    <li><strong>QB health.</strong> Each QB's yards per attempt is shrunk toward a backup-level baseline until he has about 60 attempts, and a QB change moves his team's points by about 2.5 points per yard of difference. His receivers' catch rate and yards per catch move by the same ratio. You can switch the QB on any game.</li>
    <li><strong>Score.</strong> Each team gets 11 drives that end in a touchdown, a field goal or nothing, so scores land on 3s and 7s like real ones. A shared "game pace" draw makes both teams' scoring move together, which is what drives game totals.</li>
    <li><strong>Volume follows the score.</strong> Teams that fall behind throw more and run less, and teams that lead do the opposite. Base pass and run volume comes from each team's recent games with that game-script effect removed, adjusted for the opponent.</li>
    <li><strong>Who gets the ball.</strong> Targets and carries are split by each player's recent share of his team's targets and carries (recent weeks weighted more), using a Dirichlet-multinomial so shares wobble game to game the way they do in real life. Each receiver's target share starts from his share over the last two seasons (nflverse weekly stats; the older season at half weight, and the whole prior at half weight if he changed teams) and moves toward this season's as games come in. Players new to the league start from the typical share for their role (WR1, WR2, WR3, TE, RB). Catch rate and yards per catch start from those seasons the same way. Adding last season cut the backtest error on targets, catches and receiving yards by roughly 5–10%. When players are out, their targets go partly to fill-ins who haven't shown up in the box scores yet rather than all to the starters, which is what happens in real games. Ruled-out players' carries still flow to the teammates still playing. A questionable or doubtful player's chance of playing comes from his designation and his final practice status (fit on 2023–25 injury reports: questionable players played 45% of the time after missing Friday practice, 58% after a limited practice, 67% after a full one; doubtful players almost never), and his props are measured only in the games he plays, because books void props for players who don't take a snap. Since Nov 4 each target share also leans halfway toward a route-based share: how often he runs a route when his team drops back (this season's snap counts, adjusted by his pass-down tendency from 2024–25 on-field data) times his targets per route (this season plus last season's real figure). On 2022–25 and 2026 so far it made catch props more accurate (anytime-TD chances slightly less).</li>
    <li><strong>What they do with it.</strong> Catch rate, yards per catch and yards per carry use empirical-Bayes shrinkage: each player is pulled toward his position's average until he has enough volume to trust. They are then adjusted for the opponent's defense, this week's QB, weather (wind over 12 mph, rain, cold), and by up to ±6% for meetings with this opponent last season and this season. Yards are drawn one catch and one carry at a time from skewed (gamma) distributions, so the long-play tails behind alternate lines come out naturally.</li>
    <li><strong>Big-play chance.</strong> Each receiver gets a chance that a catch goes 20+ yards, worked out from how far downfield he's targeted (air yards per target; deep threats ~20–25%, slot receivers and backs ~5–12%). It sets the starting point for his yards per catch, which his actual yards then update. Tested on 2023–2026: slightly better in 2024, 2025 and 2026, even in 2023. Two other big-play inputs were tested and left out: drawing each play's yards from real big-play frequencies, and running backs' or defenses' 10+ yard run rates (both made rushing yards worse).</li>
    <li><strong>Advanced stats.</strong> Two Next Gen Stats inputs feed the per-play rates at a light weight: a back's rushing yards over expected (yards beyond what his blocking and the defense's front gave him) moves his yards per carry, and a receiver's yards after catch over expected moves his yards per catch. Nine advanced inputs were tested on 2023–25 and 2026 (red-zone share, pass rate over expected, separation, pass rush vs pass block, run blocking, explosive passes allowed, air-yards share, practice-report snap limits); only these two improved all three past seasons without hurting this season, and the gain is small.</li>
    <li><strong>Watch sim.</strong> Each game's <em>Watch sim</em> view plays one game snap by snap on a broadcast-style field: dots with jersey numbers (the projected skill players, plus each team's 5 linemen and 11 defenders with the most snaps in their last 2 games), the line of scrimmage in blue, the first-down line in yellow and a score bug, then the box score. Every snap is a run or pass from the team's projected pass rate (adjusted for down, distance and score); targets and carries follow the projected shares, catches the catch rates, yards the yards per catch and carry. Before kickoff, 600 silent games tune each team so its average points and run/pass volume match the model's projection. It is one game, so it will often look nothing like the average; the props come from 4,000 of them.</li>
    <li><strong>Longest reception and longest rush.</strong> These come straight from the simulated games: every catch and carry gets its own yards, so each game has a longest catch and a longest run (0 with no catch or carry). No DraftKings line is used; the line shown is his season average of his longest, and the ladder gives his chance of a 20+, 30+ or 40+ play. Checked on 2026 Weeks 3–7 before it was added (games the model hadn't seen): longest catch 20+ 36% modeled vs 33% actual, 30+ 17% vs 16%, 40+ 8% vs 8%. Longest runs needed a fix: one-carry-at-a-time yards made too many 10–20 yard runs and too few breakaways, so the longest run is stretched at the top (10+ 57% vs 55% actual, 30+ 8% vs 9%, 40+ 3% vs 3%). A receiver's own history of long catches did not predict his next longest catch beyond what the model already uses (his air yards per target, the big-play chance above).</li>
    <li><strong>Defense vs position.</strong> Each defense gets an overall pass-defense factor for how often passes are caught against it and how many yards each catch gains, measured against what the receivers it faced usually do (so a defense isn't credited for facing weak offenses) and pulled toward league average with few games. Until Oct 28 these were split by receiver role (RB, TE, and a team's WR1, WR2 and WR3); the split versions turned out too noisy, and using the overall factor instead was more accurate on all of 2023, 2024 and 2025 and on 2026 so far, so the role split is off. A player's own past games against this opponent (since 2024) are shown on each prop; in the model they only move his carry share (receiving history was tested and added noise).</li>
    <li><strong>Touchdowns.</strong> Each team touchdown is a pass or a run, using the team's pass/run TD mix, and goes to a player with a catch or carry in that simulated game, weighted toward players who score more per touch. How many of a team's points come as touchdowns rather than field goals depends on the matchup: offenses that rarely go three-and-out and hit more 20+ yard plays, against defenses that allow them, turn more drives into touchdowns (this changes touchdown props only; yards, catches and carries are unchanged).</li>
    <li><strong>Calibration.</strong> Over/under chances are the simulator's own, plus a small in-season correction per prop type that the weekly tune-up refits from this season's completed weeks (capped at about ±7 points, and small until there's enough data). Fixed corrections carried over from other seasons were tested and dropped; the in-season version improved accuracy when tested on all of 2025. Touchdown chances keep a small correction fit on ${(d.calibration&&d.calibration.td?d.calibration.td.n:730).toLocaleString()} past outcomes that pulls very low and very high chances toward the middle.</li>
  </ol>
  <h3>Model change log</h3>
  <p class="sub">Every change to the model, newest first. After each week the model's misses are taken apart (team volume, share of targets or carries, catch rate, yards per catch, game script, snaps, QB) and any fix is tested on games it wasn't tuned on before it goes in.</p>
  ${(d.changelog&&d.changelog.length)?`<ul class="clog">${d.changelog.map(c=>`<li><b>${esc(c.date)}</b> — ${esc(c.change)}<div class="sub">Why: ${esc(c.why)}${c.tested?` · Tested: ${esc(c.tested)}`:''}</div></li>`).join('')}</ul>`:'<p class="sub">No changes logged yet.</p>'}
  <h3>Whose probability is it?</h3>
  <p>${PROB_MODE==='model'?'<strong>The model\'s own.</strong> ':''}Every chance on this page comes from the simulation and the inputs above. Team scores come from the model's own ratings, not the spread. DraftKings lines and prices (from The Odds API; ESPN's DraftKings feed as a backup) do two things only. They pick which lines are worth pricing, since a book line is a bet you can actually make, and they supply the price used to measure the edge. They don't move the probabilities.</p>
  <p>The <em>Probabilities</em> switch at the top has a second setting, <em>Blend with book lines</em>. In that mode the model leans ${Math.round((1-MODEL_W)*100)}% on posted lines. That is more conservative and usually shows smaller edges.</p>
  <h3>Betting math</h3>
  <ul>
    <li><strong>Fair odds and edge.</strong> Fair odds are the model's chance turned into American odds. Edge is the model's chance minus the chance implied by the price (−110 if you haven't entered one).</li>
    <li><strong>No-vig market chance.</strong> Game props show the book's own chance with the vig removed (power method), so you can see how far the model is from the market. A gap of 15 points or more gets a <em>Far from market</em> flag. Five games is a small sample, and the book also knows last season, the preseason and news the model may not see.</li>
        <li><strong>Correlated parlays.</strong> Books price same-game parlays with correlation in mind, and so does the Parlay builder. Same-game legs are priced from the same simulated games, so a QB's yards and his WR1's yards hitting together is counted once, not multiplied as if unrelated. The builder shows the correlated chance and the naive independent chance. Each game's Parlays tab uses the same method to suggest the most likely and best-value 3, 4 and 5 leg parlays from DraftKings-priced legs the model rates at least fair.</li>
    <li><strong>Game lines.</strong> Moneyline, spread and total chances come from the same simulated games and are shown with their edge, but since Nov 5 they are logged as leans, not picks. Tested on 2022–25 against closing lines, betting the model's own game-line edges lost money (moneylines about −97 units, long underdogs −45, spreads −53, totals about even): the market prices games better than the model does. Player props are where the model's information adds the most.</li>
    <li><strong>Closing line value.</strong> The Track record tab logs every pick with a 4+ point edge against DraftKings, follows the line until kickoff, then grades it from nflverse box scores (ESPN only for a game nflverse hasn't posted yet). Beating the closing line is the earliest reliable sign that a model is sharp. Win-loss takes hundreds of bets to mean much.</li>
  </ul>
  <h3>Backtest: Weeks 3–5 of 2026</h3>
  <p>I rebuilt the model as of each week using only earlier games, ran the simulator in model-only mode, and compared it with what happened. The line was each player's prior season average, which is close to how books open lines. Lower Brier scores are better. "Naive" uses how often the player went over that number in his earlier games, which is the "he's hit it every week" approach.</p>
  <table><thead><tr><th>Market</th><th>Props</th><th>Brier: model</th><th>Brier: naive</th><th>Avg error: model</th><th>Avg error: season avg</th></tr></thead><tbody>
  <tr><td>Passing yds</td><td>79</td><td>0.210</td><td>0.242</td><td>57.7</td><td>66.8</td></tr>
  <tr><td>Receiving yds</td><td>406</td><td>0.239</td><td>0.251</td><td>26.3</td><td>26.6</td></tr>
  <tr><td>Receptions</td><td>406</td><td>0.241</td><td>0.238</td><td>1.9</td><td>1.9</td></tr>
  <tr><td>Rushing yds</td><td>148</td><td>0.237</td><td>0.265</td><td>24.1</td><td>25.0</td></tr>
  <tr><td>Anytime TD</td><td>507</td><td>0.194</td><td>0.217</td><td>—</td><td>—</td></tr>
  </tbody></table>
  <p>The model beat hit rates alone on passing yards, rushing yards, receiving yards and touchdowns, and roughly tied on receptions. That's why hit rates are shown as a check on the model rather than as the model. On game winners (47 games) the model-only scores had a Brier of 0.211, against 0.237 for the closing moneylines. Its game totals missed by 11.0 points on average, against 10.2 for the posted totals, so the market is still better on totals. Forty-seven games is too few to claim it beats the market. Treat edges under about 5 points as noise. Very large edges usually mean the model is missing news, such as a role change, a snap limit or a new team, so check before betting them.</p>
  <h3>What it can't see</h3>
  <p>Routes run aren't public during the season (nflverse posts who was on the field for each play only after the season), so 2026 routes are estimated from snap counts and each player's pass-down tendency in 2024–25. Coverage (man vs zone) isn't available for 2026 at all, and it didn't help when tested on 2022–25. EPA comes from nflverse play-by-play.</p>
  <h3>Lines and prices</h3>
  <ul><li><strong>DK</strong> lines and prices are DraftKings', pulled through The Odds API (ESPN's DraftKings feed fills in lines with no price, shown as −110*). A game shows <em>Lines posted</em> once most of its starters have a line.</li>
  <li>Props without a posted line show the <strong>model's projection</strong> (the median of the simulated games), compared with a line built from the player's season average, which is roughly how books open.</li>
  <li><strong>est.</strong> lines appear before books post. They are the player's season average scaled to the simulated median, which is how books tend to open.</li>
  <li>Game lines are DraftKings' (The Odds API, then ESPN's feed), then the nflverse consensus if DraftKings has none.</li></ul>
  <h3>Updating</h3>
  <p><strong>Update data</strong> starts a refresh on Claude's side. It pulls new box scores, lines, injuries, QB news and weather, rebuilds the model and republishes this page, which usually takes 20–40 minutes, and the page reloads itself when it's done. Refreshes also run automatically Wednesday at 8:53 AM and Sunday at 10:53 AM ET.</p>
  <h3>Data used this week</h3>
  <ul>${(d.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join('')}<li><a href="https://www.espn.com/nfl/odds" target="_blank" rel="noopener">DraftKings odds board (ESPN)</a></li></ul>
  <p class="note">League baselines: ${L.ypa} yds/att, ${(L.cr*100).toFixed(0)}% catch rate, ${L.ypr} yds/catch, ${L.ypc} yds/carry, ${L.ppg} pts per team, home field ${L.hfa} pts. Data built ${esc(d.built)}.</p>`;
}

/* game lines from the same sims */
function glRows(g){ const dk=g.market.dk; if(!dk) return []; const o=sim(g),A=o.pts[g.away],H=o.pts[g.home],n=A.length;
  const cover=(home,line)=>{ let w=0,p=0; for(let i=0;i<n;i++){ const m=(home?H[i]-A[i]:A[i]-H[i])+line; if(m>0) w++; else if(m===0) p++; } return w/(n-p); };
  const ov=T=>{ let w=0,p=0; for(let i=0;i<n;i++){ const t=A[i]+H[i]; if(t>T) w++; else if(t===T) p++; } return w/(n-p); }; const sp=v=>(v>0?'+':'')+v;
  const R=[[`${g.away} to win`,cover(false,0),dk.away_ml,'ML'],[`${g.home} to win`,cover(true,0),dk.home_ml,'ML'],[`${g.away} ${sp(dk.away_spread)}`,cover(false,dk.away_spread),dk.away_spread_odds??-110,'SP'],[`${g.home} ${sp(dk.home_spread)}`,cover(true,dk.home_spread),dk.home_spread_odds??-110,'SP']];
  if(dk.total!=null){ const po=ov(dk.total); R.push([`Over ${dk.total}`,po,dk.over_odds??-110,'TOT'],[`Under ${dk.total}`,1-po,dk.under_odds??-110,'TOT']); }
  return R.filter(r=>r[1]!=null&&!isNaN(r[1])).map(([label,p,odds,k])=>({g,label,p,odds,k,edge:odds!=null?p-implied(odds):null})); }

/* ---------- Best bets ---------- */
function toolBest(el){ if(needSims(el,toolBest)) return;
  const v=TS('bv','likely'), gsel=TS('best_all',true)?'all':(curGame()||{}).id, pos=TS('bpos','any'), dkOnly=TS('bdk',true), N=+TS('best_n',60), now=Date.now();
  const inG=g=>(gsel==='all'||g.id===gsel)&&kick(g)>now-3.6e6*4;
  let rows=[], note='';
  if(v==='game'){ for(const g of D.games){ if(!inG(g)) continue; for(const r of glRows(g)) if(r.odds!=null&&r.edge>=0) rows.push(r); } rows.sort((a,b)=>b.edge-a.edge); }
  else { for(const [pid,p] of Object.entries(D.players)){ if(p.status==='OUT'||p.status==='D') continue; const g=D.games.find(x=>x.id===p.game); if(!g||!inG(g)) continue; if(p.pos==='QB'&&p.name!==qbOf(g.teams[p.team])) continue; if(pos!=='any'&&(p.pos==='FB'?'RB':p.pos)!==pos) continue;
      for(const m of marketsFor(pid)){ const td=m.mk==='ATD';
        if(v==='alt'){ if(td||['PA','PC','CAR','PRY'].includes(m.mk)) continue; const floor=m.mk==='PTD'?2:YDS.has(m.mk)?Math.max(m.mk==='PY'?175:25,.6*m.q.q50):Math.max(2,.6*m.mean); let best=null;
          for(const r of ladder(m)) if(r.k>=floor&&r.p>=.6) best=r; if(best) rows.push({kind:'alt',p,pid,g,m,k:best.k,pr:best.p,h:best.h}); continue; }
        const over=td||m.po>=.5, pr=td?m.po:(over?m.po:m.pu), dk=td?(p.lines&&p.lines.ATD&&p.lines.ATD.ov!=null):m.L.src==='DK'; if(dkOnly&&!dk) continue;
        const price=td?(dk?p.lines.ATD.ov:null):(dk?((over?m.L.ov:m.L.un)??-110):null), e=price!=null?pr-implied(price):null;
        if(v==='likely'){ if(td) continue; rows.push({kind:'prop',p,pid,g,m,over,pr,price,e,dk,est:dk&&(over?m.L.ov:m.L.un)==null}); }
        else if(e!=null&&e>=(td?.08:.03)) rows.push({kind:'prop',p,pid,g,m,over,pr,price,e,dk,td,est:!td&&(over?m.L.ov:m.L.un)==null}); } }
    rows.sort(v==='value'?(a,b)=>b.e-a.e:(a,b)=>b.pr-a.pr);
    if(v==='alt'){ note='The highest rung on each player’s alt-line ladder the model gives a 60%+ chance, with how often he reached it this season.'; } }
  const head=`<div class="tctl">${segH('bv',[['likely','Most likely'],['value','Best price'],['alt','Alt lines'],['game','Game lines']],v)}
    ${gameChips({all:true,allOn:gsel==='all'})}
    ${v!=='game'?`<div class="tctl-row">${chipsH('bpos',[['any','All'],['QB','QB'],['RB','RB'],['WR','WR'],['TE','TE']],pos)}${v!=='alt'?`<button type="button" class="chip press" data-tt="bdk" aria-pressed="${dkOnly}">DraftKings lines only</button>`:''}</div>`:''}</div>
    <p class="sm muted tnote">${v==='likely'?'Props ranked by the model’s chance of its side, highest first.':v==='value'?'Props where the model’s chance beats what the DraftKings price needs by 3+ points (anytime TDs 8+), biggest edge first.':v==='alt'?note:'Moneyline, spread and total edges from the same simulated games. Logged as leans, not picks: tested on 2022–25 the market priced games better than the model.'}</p>`;
  const row=(r,i)=>{ if(r.kind==='alt') return `<button type="button" class="plk press in" style="--i:${Math.min(i,14)}" data-p="${r.pid}" data-mk="${r.m.mk}"><div class="who"><b>${esc(r.p.name)}</b><span class="xs muted">${r.p.team} ${r.p.pos} · ${gameKey(r.g)} · ${dayShort(r.g)} ${fmtTime(r.g.time)}</span></div><div class="mid"><div class="bet">${r.k}+ ${esc(MK[r.m.mk].unit)}</div><span class="xs muted num">proj ${r.m.q.q50} · hit ${r.h.k}/${r.h.n} games</span></div><div class="r"><span class="pc num">${pct(r.pr)}</span><span class="xs muted num">fair ${amer(r.pr)}</span></div></button>`;
    if(r.kind==='prop'){ const bet=r.td?'Anytime TD':`${r.over?'Over':'Under'} ${r.m.L.l} ${MK[r.m.mk].unit}`;
      return `<button type="button" class="plk press in" style="--i:${Math.min(i,14)}" data-p="${r.pid}" data-mk="${r.m.mk}"><div class="who"><b>${esc(r.p.name)}${statusTag(r.p)?' '+statusTag(r.p):''}</b><span class="xs muted">${r.p.team} ${r.p.pos} · ${gameKey(r.g)} · ${dayShort(r.g)} ${fmtTime(r.g.time)}</span></div>
        <div class="mid"><div class="bet"><span class="side ${r.over?'over':'under'}">${bet}</span>${pickTag(r.m)}${r.dk?'':' <span class="tag est">est. line</span>'}</div>${r.td?'':rangeBar(r.m,'static')}</div>
        <div class="r"><span class="pc num">${pct(r.pr)}</span><span class="xs muted num">${r.price!=null?fmtO(r.price)+(r.est?'*':''):'fair '+amer(r.pr)}${r.e!=null?' · edge '+sg(r.e*100):''}</span>${v==='value'?valTag(r.e,r.td):''}</div></button>`; }

        else { if(m.L.src!=='DK') continue; side=m.po>=m.pu?'over':'under'; odds=(side==='over'?m.L.ov:m.L.un)??-110; pr=side==='over'?m.po:m.pu; }

      for(let i=0;i<n;i++){ const x=k==='SP'?(side==='home'?H[i]-A[i]:A[i]-H[i])+line:(side==='over'?H[i]+A[i]-line:line-H[i]-A[i]); const r=x>0?1:x===0?-1:0; ind[i]=r; if(r>=0){ c++; w+=r; } }

   <div class="sec"><h3>${changed?'Biggest changes':'Key projections'}</h3><div class="card tblw"><table class="tbl"><thead><tr><th>Player</th><th>Prop</th><th>${changed?'Real':'Proj.'}</th>${changed?'<th>What-if</th>':''}<th>Line</th><th>Over</th></tr></thead><tbody>${rows.slice(0,24).map(r=>`<tr><td><b style="font-weight:600">${esc(r.p.name)}</b> <span class="xs muted">${r.p.team} ${r.p.pos}</span></td><td>${esc(MK[r.mk].label)}</td><td class="num">${changed?Math.round(r.m0):r.m1}</td>${changed?`<td class="num"><b>${r.m1}</b> ${dd(r.m0,r.m1,.5)}</td>`:''}<td class="num">${r.m.L.l}</td><td class="num">${pct(r.po1)}${changed&&Math.abs(r.po1-r.po0)>=.01?` <span class="xs muted">was ${pct(r.po0)}</span>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
  el.querySelectorAll('[data-wqb]').forEach(btn=>btn.addEventListener('click',()=>{ const tm=g.teams[btn.dataset.team]; if(btn.dataset.wqb===tm.qb_default) delete QBSEL[tm.team]; else QBSEL[tm.team]=btn.dataset.wqb; store.set('qb',QBSEL); resimGame(g); renderToolBody(); toast(`Re-simulated with ${lastName(btn.dataset.wqb)} at quarterback`); }));
  el.querySelectorAll('[data-wx]').forEach(inp=>{ const k=inp.dataset.wx, unit={wind:' mph',precip:'%',temp:'°'}[k];
    inp.addEventListener('input',()=>{ el.querySelector(`[data-wv="${k}"]`).textContent=inp.value+unit; inp.style.setProperty('--v',((inp.value-inp.min)/(inp.max-inp.min)*100)+'%'); });
    inp.addEventListener('change',()=>{ (WXSEL[g.id]=WXSEL[g.id]||{})[k]=+inp.value; store.set('wx',WXSEL); resimGame(g); renderToolBody(); }); });
  const rs=$('#wiReset'); if(rs) rs.addEventListener('click',()=>{ delete WXSEL[g.id]; store.set('wx',WXSEL); for(const t of [g.away,g.home]) delete QBSEL[t]; store.set('qb',QBSEL); resimGame(g); renderToolBody(); toast('Back to the real game'); }); }

/* about */
function renderAbout(){ const d=D, L=d.league||{}; const t=s=>{ try{ return new Date(s).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET'; }catch(e){ return s; } };
  $('#main').innerHTML=`<section class="view"><div class="vhead"><div><h1>How it works</h1><p>The model, the data and what the numbers mean.</p></div></div>
   <div class="grid2"><div class="prose">
   <h3 style="margin-top:0">One simulator for everything</h3><p>Each Week ${d.week} game is played out ${N.toLocaleString()} times. Every player projection, alt line and game number on this page comes from the same simulated games, so a quarterback's yards are the sum of what his receivers catch and anytime touchdowns add up to the team's touchdowns.</p>
   <h3>What goes in</h3><ul><li><b>Team strength:</b> points, yards per play and EPA per play, opponent-adjusted, this season plus last season at reduced weight, with rest and home field (${L.hfa??'—'} pts this season).</li>
   <li><b>Who gets the ball:</b> each player's share of targets and carries, starting from his last two seasons and moving toward this season's as games come in, with snap counts and route estimates.</li>
   <li><b>What they do with it:</b> catch rate, yards per catch and per carry, pulled toward position averages until there's enough data, then adjusted for the defense, the QB, weather and big-play chance.</li>
   <li><b>News:</b> injuries, inactives and QB starters from team reports and NFL insiders; a QB only changes once the team confirms it.</li></ul>
   <h3>Reading a projection</h3><p>Each bar shows the middle half of the simulated outcomes (darker) and the middle 80% (lighter). The dot is the median, which is the projection; the tick is the DraftKings line. When the dot sits right of the tick, the over is more likely. The percentage is the model's chance of that side, with a small in-season correction per prop type.</p>
   <h3>Picks</h3><p>A pick is a prop where the model's chance beats the price by 4+ points (anytime TD: 8+ and a price up to +600). Every posted prop is also logged as a lean, so the record shows how the model does on all of them. Picks are graded from nflverse box scores at the price logged with them. Game lines are shown for context only: tested on 2022–25, the market priced games better than the model.</p>
   <h3>How it's checked</h3><p>Every model change is tested on three past seasons plus this one, and since Nov 9 a change that fails past seasons but helps 2026 can stay at half strength while it keeps helping. The calibration chart on the Record tab shows how honest the stated chances have been.</p>
   </div>
   <div><div class="card" style="padding:18px"><dl class="kv"><dt>Week</dt><dd>${d.week}, ${d.season}</dd><dt>News updated</dt><dd>${esc(t(d.updated))}</dd><dt>Lines fetched</dt><dd>${esc(t(d.market_fetched))}</dd><dt>Stats</dt><dd>nflverse, ${d.games_in_data} games</dd><dt>League</dt><dd class="num">${L.ypa} yds/att · ${L.ppg} pts/team</dd></dl></div>
     <div class="sec"><h3>Sources this week</h3><div class="card" style="padding:12px 18px"><ul style="margin:0;padding-left:16px;font-size:13.5px;line-height:1.8">${(d.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join('')}</ul></div></div>
     <div class="sec"><h3>Recent model changes</h3><div class="card" style="padding:4px 18px">${(d.changelog||[]).slice(0,5).map(c=>`<div style="padding:12px 0;border-top:1px solid var(--line)" class="sm"><b>${esc(c.date)}</b><div class="muted" style="margin-top:2px">${esc(c.change)}</div></div>`).join('')}</div></div></div></div>
   <div class="fold card method" id="method"><button type="button" class="fold-h" aria-expanded="false"><b>Full method, backtests and change log</b><span class="xs muted">everything the model does, in detail</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="acc"><div class="acc-in"><div class="prose">${howHTML()}</div><p class="xs muted" style="margin:0 0 16px">Parlays, the play-by-play sim and the QB / weather what-ifs are under More.</p></div></div></div></section>`; }

/* update (Claude Code Remote trigger) */
let MCP=null;
function initUpdate(){ if(window.claude&&window.claude.use) window.claude.use('mcp').then(m=>{MCP=m;}).catch(()=>{MCP=null;});
  const pop=$('#updPop'); const close=()=>{ pop.hidden=true; };
  $('#updBtn').addEventListener('click',()=>{ if(!pop.hidden){ close(); return; } reload(); if(!MCP){ $('#updMsg').textContent='Loaded the latest published numbers. A full refresh can be started from the Claude app view of this page; refreshes also run Wednesday and Sunday mornings.'; $('#updGo').hidden=true; } else { $('#updMsg').textContent='Start a full refresh? It pulls new stats, lines, injuries and weather in a Claude session (20–40 min) and republishes this page.'; $('#updGo').hidden=false; } pop.hidden=false; });
  $('#updNo').addEventListener('click',close);
  $('#updGo').addEventListener('click',async()=>{ $('#updGo').disabled=true; try{ await MCP.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIGGER_ID,text:'Started from the Update button at '+new Date().toISOString()}); toast('Refresh started. New numbers load when it finishes.'); close(); }catch(e){ $('#updMsg').textContent='Could not start the refresh: '+(e&&e.message||'unknown error')+'. Try again from the Claude app.'; } $('#updGo').disabled=false; });
  document.addEventListener('click',e=>{ if(!pop.hidden&&!e.target.closest('.tools')) close(); }); }
function reload(){ Promise.all([fetch('data/week.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/picks_log.json',{cache:'no-store'}).then(r=>r.ok?r.json():{picks:[]}).catch(()=>({picks:[]}))]).then(([w,l])=>{ if(D&&w.built===D.built){ LOG=l; return; } D=w; LOG=l; CAL=w.calibration||CAL; SIM={}; boot(); toast('Loaded the latest numbers'); }).catch(()=>{}); }

/* theme */
function initTheme(){ const b=$('#themeBtn'); b.addEventListener('click',()=>{ const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark';
  const go=()=>{ document.documentElement.setAttribute('data-theme',nx); try{ localStorage.setItem('hm6:theme',JSON.stringify(nx)); }catch(e){} };
  if(document.startViewTransition&&!RM()) document.startViewTransition(go); else go(); }); }

function boot(){ $('#wk').textContent=`Week ${D.week} · ${D.season}`; setView(VIEW,false); FROWS=null; simAll(()=>{ if(VIEW==='picks') renderPicks(); if(VIEW==='slate') prebuildGames(); }); }
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{ closePlayer(true); stopWatch(); TOOL=null; TOOL_FROM=null; if(SH.length) while(SH.length) popSheet(); setView(b.dataset.v,true); }));
$('#scrim').addEventListener('click',()=>{ while(SH.length) popSheet(); });
window.addEventListener('resize',movePill);
initTheme(); initUpdate();
$('#main').innerHTML='<div class="games" style="margin-top:8px">'+Array.from({length:6},()=>'<div class="game"><div class="teams"><div class="trow"><span class="tname skel">Loading team</span></div><div class="trow"><span class="tname skel">Loading team</span></div></div><div class="score"><span class="skel">00</span><span class="skel">00</span></div></div>').join('')+'</div>';
Promise.all([fetch('data/week.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/picks_log.json',{cache:'no-store'}).then(r=>r.ok?r.json():{picks:[]}).catch(()=>({picks:[]}))])
 .then(([w,l])=>{ D=w; LOG=l; CAL=w.calibration||CAL; if(document.fonts&&document.fonts.ready) document.fonts.ready.then(movePill); boot(); })
 .catch(e=>{ $('#main').innerHTML=`<div class="empty">Couldn't load this week's data (${esc(e.message)}). Reload the page to try again.</div>`; });
})();

</script>
